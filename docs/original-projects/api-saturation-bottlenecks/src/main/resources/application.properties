spring.application.name=api-saturation-bottlenecks
server.address=127.0.0.1
server.port=8080
# Deliberately small servlet pool; do not enable global virtual threads and hide the violation.
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.mbeanregistry.enabled=true
spring.threads.virtual.enabled=false
spring.mvc.async.request-timeout=30s
spring.datasource.url=jdbc:h2:mem:saturation;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Deliberately small demonstration pool, not production sizing guidance.
spring.datasource.hikari.pool-name=demo-pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# A separate connector keeps diagnostics accessible during servlet saturation.
management.server.address=127.0.0.1
management.server.port=8081
management.endpoints.web.exposure.include=health,metrics,threaddump
